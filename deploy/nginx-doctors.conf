# /etc/nginx/sites-available/doctors.anywherehealing.com
# Then: ln -s ../sites-available/doctors.anywherehealing.com /etc/nginx/sites-enabled/
#       certbot --nginx -d doctors.anywherehealing.com
server {
    listen 80;
    server_name doctors.anywherehealing.com;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
